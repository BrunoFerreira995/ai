apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-model-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-model-api
  template:
    metadata:
      labels:
        app: ai-model-api
    spec:
      containers:
        - name: api
          image: ai-model-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /app/artifacts/saved_model
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-model-api
spec:
  selector:
    app: ai-model-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
