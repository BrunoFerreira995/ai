properties:
  managedEnvironmentId: /subscriptions/SUBSCRIPTION_ID/resourceGroups/RESOURCE_GROUP/providers/Microsoft.App/managedEnvironments/CONTAINER_APP_ENV
  configuration:
    ingress:
      external: true
      targetPort: 8000
      transport: http
  template:
    containers:
      - name: ai-model-api
        image: REGISTRY.azurecr.io/ai-model-api:latest
        env:
          - name: MODEL_PATH
            value: /app/artifacts/saved_model
        resources:
          cpu: 2.0
          memory: 4Gi
    scale:
      minReplicas: 1
      maxReplicas: 10
